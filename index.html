<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spelling Game</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #111111;
    --muted: #666666;
    --line: #bbbbbb;
    --good: #1a7f37;
    --bad: #c62828;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #181818;
      --fg: #eeeeee;
      --muted: #999999;
      --line: #555555;
      --good: #4ade80;
      --bad: #f87171;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.4;
  }

  main {
    width: 100%;
    max-width: 380px;
    padding: 24px;
  }

  h1 { font-size: 1.4rem; margin: 0 0 8px; font-weight: 600; }
  p { margin: 0 0 16px; color: var(--muted); }

  button {
    font: inherit;
    color: inherit;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 10px 14px;
    cursor: pointer;
    transition: border-color .15s, background-color .15s;
  }
  button:hover { border-color: var(--fg); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  .hidden { display: none; }

  /* Menu */
  .levels { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .level { text-align: left; display: flex; justify-content: space-between; }
  .level span { color: var(--muted); }
  .level[aria-pressed="true"] { border-color: var(--fg); background: rgba(128,128,128,.12); }
  .primary { width: 100%; background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .primary:hover { opacity: .85; }
  #loadError { margin: 16px 0 0; color: var(--bad); }

  /* Settings */
  .setting { margin-bottom: 20px; }
  .setting label { display: block; margin: 12px 0 6px; font-size: .9rem; color: var(--muted); }
  .setting label:first-child { margin-top: 0; }
  .setting .row { display: flex; gap: 8px; }
  select {
    flex: 1;
    width: 100%;
    font: inherit;
    color: inherit;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 10px;
  }
  .hint { font-size: .85rem; color: var(--muted); margin: 8px 0 0; }
  .note { font-size: .85rem; color: var(--muted); min-height: 1.2em; margin: 4px 0 0; }

  /* Game */
  .top { display: flex; justify-content: space-between; color: var(--muted); font-size: .9rem; margin-bottom: 28px; }

  .play-row { display: flex; gap: 8px; margin-bottom: 8px; animation: fade .35s ease; }
  .play-row .play { flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; }
  #voiceNote { text-align: center; margin: 0 0 12px; }

  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--muted);
  }
  .speaking .dot { animation: pulse .7s ease-in-out infinite; background: var(--fg); }

  input[type="text"] {
    width: 100%;
    font: inherit;
    font-size: 1.3rem;
    padding: 12px;
    text-align: center;
    color: inherit;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 4px;
    margin-bottom: 12px;
    transition: border-color .2s;
  }
  input.ok { border-color: var(--good); }
  input.bad { border-color: var(--bad); animation: shake .35s; }

  #feedback { min-height: 1.5em; margin: 0 0 12px; text-align: center; }
  #feedback.ok { color: var(--good); }
  #feedback.bad { color: var(--bad); }

  .bottom { margin-top: 24px; text-align: center; }
  .link { border: none; color: var(--muted); text-decoration: underline; padding: 4px; }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.6); } }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main>

  <!-- Menu -->
  <section id="menu">
    <h1>Spelling Game</h1>
    <p>Listen to the word, then type how it's spelled.</p>

    <div class="levels" id="levels">
      <button class="level" data-level="easy" aria-pressed="false">Easy <span>short, common words</span></button>
      <button class="level" data-level="normal" aria-pressed="true">Normal <span>trickier words</span></button>
      <button class="level" data-level="hard" aria-pressed="false">Hard <span>tough words</span></button>
    </div>

    <div class="setting">
      <label for="voiceSel">Voice</label>
      <div class="row">
        <select id="voiceSel">
          <option value="kokoro">Kokoro (AI, in your browser)</option>
          <option value="google">Google (online)</option>
          <option value="browser">Browser voice</option>
        </select>
        <button id="testBtn" type="button">Test</button>
      </div>

      <div id="kvoiceWrap">
        <label for="kvoiceSel">Kokoro voice</label>
        <select id="kvoiceSel">
          <option value="af_heart">Heart (female, US)</option>
          <option value="af_bella">Bella (female, US)</option>
          <option value="am_michael">Michael (male, US)</option>
          <option value="bf_emma">Emma (female, UK)</option>
          <option value="bm_george">George (male, UK)</option>
        </select>
      </div>

      <p class="hint" id="voiceHint"></p>
      <p class="note" id="modelNote"></p>
      <p class="note" id="testNote"></p>
    </div>

    <button class="primary" id="startBtn" disabled>Loading words...</button>
    <p id="loadError" class="hidden"></p>
  </section>

  <!-- Game -->
  <section id="game" class="hidden">
    <div class="top">
      <span id="levelLabel"></span>
      <span>Score: <b id="score">0</b> &nbsp; Streak: <b id="streak">0</b></span>
    </div>

    <div class="play-row" id="playRow">
      <button class="play" id="playBtn"><span class="dot"></span> Play word</button>
      <button id="slowBtn" title="Play slowly">Slow</button>
    </div>
    <p class="note" id="voiceNote"></p>

    <input type="text" id="answer" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type the spelling" placeholder="Type the word">
    <button class="primary" id="checkBtn">Check</button>
    <p id="feedback" role="status" aria-live="polite"></p>

    <div class="bottom">
      <button class="link" id="menuBtn">Change difficulty or voice</button>
    </div>
  </section>

</main>

<script>
const $ = id => document.getElementById(id);
const menu = $("menu"), game = $("game");
const answer = $("answer"), feedback = $("feedback");

let WORDS = null;          // loaded from words.json
let level = "normal";
let queue = [];
let current = "";
let score = 0, streak = 0;
let locked = false;
let browserVoice = null;

const hasTTS = "speechSynthesis" in window;

/* ---------- Load words from words.json ---------- */
async function loadWords() {
  const startBtn = $("startBtn");
  try {
    const res = await fetch("words.json");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    for (const k of ["easy", "normal", "hard"]) {
      if (!Array.isArray(data[k]) || data[k].length === 0) {
        throw new Error('Missing or empty list: "' + k + '"');
      }
    }
    WORDS = data;
    startBtn.disabled = false;
    startBtn.textContent = "Start";
  } catch (err) {
    startBtn.textContent = "Start";
    const box = $("loadError");
    box.textContent = "Couldn't load words.json (" + err.message + "). " +
      "Make sure it's next to index.html and the page is opened through a web server or GitHub Pages, not as a local file.";
    box.classList.remove("hidden");
  }
}
loadWords();

/* ---------- Settings ---------- */
const HINTS = {
  kokoro:  "Natural AI voice that runs inside your browser. Downloads about 90 MB the first time, then it's saved.",
  google:  "Needs internet. Natural sounding, but it's an unofficial service.",
  browser: "Your device's built-in voice. Works offline."
};
const KOKORO_VOICES = ["af_heart", "af_bella", "am_michael", "bf_emma", "bm_george"];

let voiceSetting = "kokoro";
let kokoroVoice = "af_heart";
try {
  const v = localStorage.getItem("spelling.voice");
  const kv = localStorage.getItem("spelling.kvoice");
  if (v && HINTS[v]) voiceSetting = v;
  if (kv && KOKORO_VOICES.includes(kv)) kokoroVoice = kv;
} catch (e) {}

function save(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }

function refreshSettingsUI() {
  $("voiceSel").value = voiceSetting;
  $("kvoiceSel").value = kokoroVoice;
  $("kvoiceWrap").classList.toggle("hidden", voiceSetting !== "kokoro");
  $("voiceHint").textContent = HINTS[voiceSetting];
  showModel();
}

$("voiceSel").addEventListener("change", e => {
  voiceSetting = e.target.value;
  save("spelling.voice", voiceSetting);
  setNote("");
  if (voiceSetting === "kokoro") ensureKokoro().catch(() => {});
  refreshSettingsUI();
});

$("kvoiceSel").addEventListener("change", e => {
  kokoroVoice = e.target.value;
  save("spelling.kvoice", kokoroVoice);
});

$("testBtn").addEventListener("click", () => {
  const list = WORDS ? WORDS[level] : ["spelling"];
  speak(list[Math.floor(Math.random() * list.length)]);
});

function setNote(msg) {
  $("voiceNote").textContent = msg;
  $("testNote").textContent = msg;
}

/* ---------- Kokoro (runs in a background worker so the page stays smooth) ---------- */
let kokoroState = "idle";   // idle | loading | ready | error
let kokoroPct = 0;
let kokoroError = "";
let kokoroPromise = null;
let kokoroWorker = null;
let kokoroChain = Promise.resolve();   // generate one word at a time
const kokoroCache = {};                // "voice|word" -> Promise<blob url>
const pending = {};
let nextId = 1;

// This code runs in a separate thread, so downloading and generating never freeze the page.
const WORKER_SRC = `
import { KokoroTTS } from "https://cdn.jsdelivr.net/npm/kokoro-js@1/+esm";

let tts = null;
const files = {};
let lastPost = 0;

self.onmessage = async (e) => {
  const m = e.data;
  try {
    if (m.type === "init") {
      tts = await KokoroTTS.from_pretrained("onnx-community/Kokoro-82M-v1.0-ONNX", {
        dtype: "q8",
        device: "wasm",
        progress_callback: (p) => {
          if (p.status === "progress" && p.total) {
            files[p.file] = { loaded: p.loaded, total: p.total };
            const now = Date.now();
            if (now - lastPost > 250) {
              lastPost = now;
              let l = 0, t = 0;
              for (const f of Object.values(files)) { l += f.loaded; t += f.total; }
              self.postMessage({ type: "progress", pct: Math.min(99, Math.round((l / t) * 100)) });
            }
          }
        }
      });
      self.postMessage({ type: "ready" });
    } else if (m.type === "generate") {
      const audio = await tts.generate(m.text, { voice: m.voice, speed: m.speed });
      if (audio.audio) {
        const samples = new Float32Array(audio.audio);
        self.postMessage({ type: "audio", id: m.id, samples: samples, sr: audio.sampling_rate }, [samples.buffer]);
      } else {
        self.postMessage({ type: "audio", id: m.id, blob: audio.toBlob() });
      }
    }
  } catch (err) {
    self.postMessage({ type: "error", id: m.id, message: String((err && err.message) || err) });
  }
};
`;

function showModel() {
  const el = $("modelNote");
  if (voiceSetting !== "kokoro") { el.textContent = ""; return; }
  if (kokoroState === "loading") el.textContent = "Loading voice model... " + kokoroPct + "%";
  else if (kokoroState === "ready") el.textContent = "Voice model ready.";
  else if (kokoroState === "error") el.textContent = "Couldn't load the voice model (" + kokoroError + "). Try Google or Browser voice.";
  else el.textContent = "";
}

function ensureKokoro() {
  if (kokoroPromise) return kokoroPromise;
  kokoroState = "loading";
  kokoroPct = 0;
  showModel();

  kokoroPromise = new Promise((resolve, reject) => {
    try {
      const blobUrl = URL.createObjectURL(new Blob([WORKER_SRC], { type: "text/javascript" }));
      kokoroWorker = new Worker(blobUrl, { type: "module" });
    } catch (err) {
      reject(err);
      return;
    }

    kokoroWorker.onmessage = e => {
      const m = e.data;
      if (m.type === "progress") {
        kokoroPct = m.pct;
        showModel();
      } else if (m.type === "ready") {
        kokoroState = "ready";
        showModel();
        resolve();
      } else if (m.type === "audio") {
        const p = pending[m.id];
        if (p) { delete pending[m.id]; p.resolve(m); }
      } else if (m.type === "error") {
        const err = new Error(m.message);
        const p = m.id != null ? pending[m.id] : null;
        if (p) { delete pending[m.id]; p.reject(err); }
        else reject(err);
      }
    };
    kokoroWorker.onerror = ev => reject(new Error(ev.message || "Worker failed to start"));
    kokoroWorker.postMessage({ type: "init" });
  }).catch(err => {
    kokoroState = "error";
    kokoroError = (err && err.message) ? err.message : String(err);
    kokoroPromise = null;   // allow retry
    if (kokoroWorker) { kokoroWorker.terminate(); kokoroWorker = null; }
    showModel();
    throw err;
  });
  return kokoroPromise;
}

function wavFromSamples(samples, sr) {
  const buf = new ArrayBuffer(44 + samples.length * 2);
  const v = new DataView(buf);
  const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + samples.length * 2, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, "data"); v.setUint32(40, samples.length * 2, true);
  for (let i = 0; i < samples.length; i++) {
    const x = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(44 + i * 2, x < 0 ? x * 0x8000 : x * 0x7fff, true);
  }
  return new Blob([buf], { type: "audio/wav" });
}

function generateInWorker(text, voice, speed) {
  return new Promise((resolve, reject) => {
    const id = nextId++;
    pending[id] = { resolve, reject };
    kokoroWorker.postMessage({ type: "generate", id, text, voice, speed });
  });
}

const SPEED_NORMAL = 0.9, SPEED_SLOW = 0.6;

function kokoroUrl(word, slow = false) {
  const voiceId = kokoroVoice;
  const speed = slow ? SPEED_SLOW : SPEED_NORMAL;
  const key = voiceId + "|" + speed + "|" + word;
  if (!kokoroCache[key]) {
    const p = kokoroChain.then(async () => {
      const m = await generateInWorker(word, voiceId, speed);
      const blob = m.blob || wavFromSamples(m.samples, m.sr);
      return URL.createObjectURL(blob);
    });
    kokoroChain = p.catch(() => {});
    p.catch(() => { delete kokoroCache[key]; });
    kokoroCache[key] = p;
  }
  return kokoroCache[key];
}

async function kokoroSource(word, slow) {
  if (kokoroState === "error") throw new Error("Kokoro couldn't load");
  if (kokoroState !== "ready") {
    ensureKokoro().catch(() => {});
    throw new Error("Voice model still loading (" + kokoroPct + "%)");
  }
  if (!kokoroCache[kokoroVoice + "|" + (slow ? SPEED_SLOW : SPEED_NORMAL) + "|" + word]) setNote("Generating voice...");
  return await Promise.race([
    kokoroUrl(word, slow),
    new Promise((_, reject) => setTimeout(() => reject(new Error("Voice took too long")), 15000))
  ]);
}

/* ---------- Playing audio ---------- */
const player = new Audio();       // one shared element, so mobile browsers keep it unlocked
let speakToken = 0;

// Mobile browsers only allow audio after a tap. Unlock the player on the first tap.
const SILENT = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
let unlocked = false;
function unlockAudio() {
  if (unlocked) return;
  unlocked = true;
  player.src = SILENT;
  player.play().then(() => { if (player.src === SILENT) player.pause(); }).catch(() => {});
}
["click", "touchend", "keydown"].forEach(ev =>
  document.addEventListener(ev, unlockAudio, { capture: true, passive: true }));

function pickBrowserVoice() {
  if (!hasTTS) return;
  const good = ["natural", "online", "premium", "enhanced", "google us", "samantha", "aria", "jenny", "ava"];
  const rank = v => {
    const n = v.name.toLowerCase();
    return (good.some(g => n.includes(g)) ? 10 : 0) + (v.lang === "en-US" ? 2 : 0);
  };
  browserVoice = speechSynthesis.getVoices()
    .filter(v => v.lang.startsWith("en"))
    .sort((a, b) => rank(b) - rank(a))[0] || null;
}
if (hasTTS) {
  pickBrowserVoice();
  speechSynthesis.addEventListener("voiceschanged", pickBrowserVoice);
}

function stopAudio() {
  player.pause();
  if (hasTTS) speechSynthesis.cancel();
  $("playRow").classList.remove("speaking");
}

function speakFallback(word, rate) {
  if (!hasTTS) return;
  const u = new SpeechSynthesisUtterance(word);
  u.lang = "en-US";
  u.rate = rate;
  if (browserVoice) u.voice = browserVoice;
  const row = $("playRow");
  u.onstart = () => row.classList.add("speaking");
  u.onend = u.onerror = () => row.classList.remove("speaking");
  speechSynthesis.speak(u);
}

function playUrl(url, token, label, onFail) {
  const row = $("playRow");
  let started = false;
  let timer = null;

  const fail = () => {
    if (token !== speakToken) return;
    clearTimeout(timer);
    player.onplaying = player.onended = player.onerror = null;
    player.pause();
    onFail();
  };

  timer = setTimeout(() => { if (!started) fail(); }, 4000);
  player.onplaying = () => {
    started = true;
    clearTimeout(timer);
    row.classList.add("speaking");
    setNote("Playing: " + label);
  };
  player.onended = () => row.classList.remove("speaking");
  player.onerror = fail;

  player.src = url;
  player.defaultPlaybackRate = 1;
  player.playbackRate = 1;
  player.play().catch(fail);
}

async function speak(word, slow = false) {
  const token = ++speakToken;
  stopAudio();
  setNote("");

  const useBrowser = reason => {
    if (token !== speakToken) return;
    setNote((reason ? reason + ". " : "") + "Playing: Browser voice");
    speakFallback(word, slow ? 0.5 : 0.85);
  };

  if (voiceSetting === "browser") return useBrowser("");

  let url, label;
  try {
    if (voiceSetting === "google") {
      url = "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en-US&q=" + encodeURIComponent(word) + (slow ? "&ttsspeed=0.3" : "");
      label = "Google";
    } else {
      url = await kokoroSource(word, slow);
      label = "Kokoro";
    }
  } catch (e) {
    return useBrowser(e.message);
  }

  if (token !== speakToken) return;
  playUrl(url, token, label, () => useBrowser("Selected voice unavailable"));
}

/* ---------- Random word picking ---------- */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function refill() {
  queue = shuffle(WORDS[level]);
  if (queue.length > 1 && queue[queue.length - 1] === current) queue.reverse(); // avoid immediate repeat
}

function nextWord() {
  if (queue.length === 0) refill();
  return queue.pop();
}

// Generate the next word's audio in the background while the player is on this word
function preloadNext() {
  if (voiceSetting !== "kokoro" || kokoroState !== "ready") return;
  if (queue.length === 0) refill();
  kokoroUrl(queue[queue.length - 1]).catch(() => {});
}

/* ---------- Game flow ---------- */
function newRound() {
  current = nextWord();
  locked = false;
  answer.value = "";
  answer.disabled = false;
  answer.className = "";
  feedback.textContent = "";
  feedback.className = "";
  answer.focus();
  speak(current);
  preloadNext();
}

function startGame() {
  if (!WORDS) return;
  score = 0; streak = 0;
  queue = [];
  current = "";
  $("score").textContent = 0;
  $("streak").textContent = 0;
  $("levelLabel").textContent = level[0].toUpperCase() + level.slice(1);
  menu.classList.add("hidden");
  game.classList.remove("hidden");
  newRound();
}

function check() {
  if (locked) return;
  const guess = answer.value.trim().toLowerCase();
  if (!guess) return;

  if (guess === current.toLowerCase()) {
    locked = true;
    score++; streak++;
    $("score").textContent = score;
    $("streak").textContent = streak;
    answer.className = "ok";
    answer.disabled = true;
    feedback.textContent = "Correct!";
    feedback.className = "ok";
    setTimeout(newRound, 900);
  } else {
    streak = 0;
    $("streak").textContent = 0;
    // restart the shake animation
    answer.className = "";
    void answer.offsetWidth;
    answer.className = "bad";
    feedback.textContent = "Not quite. Listen again and try once more.";
    feedback.className = "bad";
    answer.select();
  }
}

/* ---------- Events ---------- */
document.querySelectorAll(".level").forEach(btn => {
  btn.addEventListener("click", () => {
    level = btn.dataset.level;
    document.querySelectorAll(".level").forEach(b =>
      b.setAttribute("aria-pressed", b === btn ? "true" : "false"));
  });
});

$("startBtn").addEventListener("click", startGame);
$("playBtn").addEventListener("click", () => { speak(current); answer.focus(); });
$("slowBtn").addEventListener("click", () => { speak(current, true); answer.focus(); });
$("checkBtn").addEventListener("click", check);
answer.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
answer.addEventListener("input", () => {
  if (!locked) { answer.className = ""; feedback.textContent = ""; }
});
$("menuBtn").addEventListener("click", () => {
  speakToken++;
  stopAudio();
  setNote("");
  game.classList.add("hidden");
  menu.classList.remove("hidden");
});

/* ---------- Start ---------- */
refreshSettingsUI();
if (voiceSetting === "kokoro") ensureKokoro().catch(() => {});
</script>
</body>
</html>
