<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spelling Game</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #111111;
    --muted: #666666;
    --line: #bbbbbb;
    --good: #1a7f37;
    --bad: #c62828;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #181818;
      --fg: #eeeeee;
      --muted: #999999;
      --line: #555555;
      --good: #4ade80;
      --bad: #f87171;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.4;
  }

  main {
    width: 100%;
    max-width: 380px;
    padding: 24px;
  }

  h1 { font-size: 1.4rem; margin: 0 0 8px; font-weight: 600; }
  p { margin: 0 0 16px; color: var(--muted); }

  button {
    font: inherit;
    color: inherit;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 10px 14px;
    cursor: pointer;
    transition: border-color .15s, background-color .15s;
  }
  button:hover { border-color: var(--fg); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  .hidden { display: none; }

  /* Menu */
  .levels { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .level { text-align: left; display: flex; justify-content: space-between; }
  .level span { color: var(--muted); }
  .level[aria-pressed="true"] { border-color: var(--fg); background: rgba(128,128,128,.12); }
  .primary { width: 100%; background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .primary:hover { opacity: .85; }
  #loadError { margin: 16px 0 0; color: var(--bad); }

  /* Settings */
  .setting { margin-bottom: 20px; }
  .setting label { display: block; margin-bottom: 6px; font-size: .9rem; color: var(--muted); }
  .setting .row { display: flex; gap: 8px; }
  select {
    flex: 1;
    font: inherit;
    color: inherit;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 10px;
  }
  .hint { font-size: .85rem; color: var(--muted); margin: 8px 0 0; }
  .note { font-size: .85rem; color: var(--muted); min-height: 1.2em; margin: 4px 0 0; }

  /* Game */
  .top { display: flex; justify-content: space-between; color: var(--muted); font-size: .9rem; margin-bottom: 28px; }

  .play-row { display: flex; gap: 8px; margin-bottom: 8px; animation: fade .35s ease; }
  .play-row .play { flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; }
  #voiceNote { text-align: center; margin: 0 0 12px; }

  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--muted);
  }
  .speaking .dot { animation: pulse .7s ease-in-out infinite; background: var(--fg); }

  input[type="text"] {
    width: 100%;
    font: inherit;
    font-size: 1.3rem;
    padding: 12px;
    text-align: center;
    color: inherit;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 4px;
    margin-bottom: 12px;
    transition: border-color .2s;
  }
  input.ok { border-color: var(--good); }
  input.bad { border-color: var(--bad); animation: shake .35s; }

  #feedback { min-height: 1.5em; margin: 0 0 12px; text-align: center; }
  #feedback.ok { color: var(--good); }
  #feedback.bad { color: var(--bad); }

  .bottom { margin-top: 24px; text-align: center; }
  .link { border: none; color: var(--muted); text-decoration: underline; padding: 4px; }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.6); } }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main>

  <!-- Menu -->
  <section id="menu">
    <h1>Spelling Game</h1>
    <p>Listen to the word, then type how it's spelled.</p>

    <div class="levels" id="levels">
      <button class="level" data-level="easy" aria-pressed="false">Easy <span>short, common words</span></button>
      <button class="level" data-level="normal" aria-pressed="true">Normal <span>trickier words</span></button>
      <button class="level" data-level="hard" aria-pressed="false">Hard <span>tough words</span></button>
    </div>

    <div class="setting">
      <label for="voiceSel">Voice</label>
      <div class="row">
        <select id="voiceSel">
          <option value="auto">Auto (best available)</option>
          <option value="kokoro">Kokoro (audio files)</option>
          <option value="piper">Piper (audio files)</option>
          <option value="google">Google (online)</option>
          <option value="browser">Browser voice</option>
        </select>
        <button id="testBtn" type="button">Test</button>
      </div>
      <p class="hint" id="voiceHint"></p>
      <p class="note" id="testNote"></p>
    </div>

    <button class="primary" id="startBtn" disabled>Loading words...</button>
    <p id="loadError" class="hidden"></p>
  </section>

  <!-- Game -->
  <section id="game" class="hidden">
    <div class="top">
      <span id="levelLabel"></span>
      <span>Score: <b id="score">0</b> &nbsp; Streak: <b id="streak">0</b></span>
    </div>

    <div class="play-row" id="playRow">
      <button class="play" id="playBtn"><span class="dot"></span> Play word</button>
      <button id="slowBtn" title="Play slowly">Slow</button>
    </div>
    <p class="note" id="voiceNote"></p>

    <input type="text" id="answer" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type the spelling" placeholder="Type the word">
    <button class="primary" id="checkBtn">Check</button>
    <p id="feedback" role="status" aria-live="polite"></p>

    <div class="bottom">
      <button class="link" id="menuBtn">Change difficulty or voice</button>
    </div>
  </section>

</main>

<script>
const $ = id => document.getElementById(id);
const menu = $("menu"), game = $("game");
const answer = $("answer"), feedback = $("feedback");

let WORDS = null;          // loaded from words.json
let level = "normal";
let queue = [];
let current = "";
let score = 0, streak = 0;
let locked = false;
let voice = null;

const hasTTS = "speechSynthesis" in window;

/* ---------- Load words from words.json ---------- */
async function loadWords() {
  const startBtn = $("startBtn");
  try {
    const res = await fetch("words.json");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    for (const k of ["easy", "normal", "hard"]) {
      if (!Array.isArray(data[k]) || data[k].length === 0) {
        throw new Error('Missing or empty list: "' + k + '"');
      }
    }
    WORDS = data;
    startBtn.disabled = false;
    startBtn.textContent = "Start";
  } catch (err) {
    startBtn.textContent = "Start";
    const box = $("loadError");
    box.textContent = "Couldn't load words.json (" + err.message + "). " +
      "Make sure it's next to index.html and the page is opened through a web server or GitHub Pages, not as a local file.";
    box.classList.remove("hidden");
  }
}
loadWords();

/* ---------- Voice settings ---------- */
const VOICE_KEY = "spelling.voice";
const HINTS = {
  auto:    "Tries Kokoro files, then Piper files, then Google, then your browser's voice.",
  kokoro:  "Plays files from audio/kokoro/ (made with generate_audio.py).",
  piper:   "Plays files from audio/piper/ (made with generate_audio.py).",
  google:  "Needs internet. Natural sounding, but it's an unofficial service.",
  browser: "Your device's built-in voice. Works offline."
};
let voiceSetting = "auto";
try {
  const saved = localStorage.getItem(VOICE_KEY);
  if (saved && HINTS[saved]) voiceSetting = saved;
} catch (e) {}

const dead = new Set(); // in Auto mode: sources that failed, so we stop trying them

$("voiceSel").value = voiceSetting;
$("voiceHint").textContent = HINTS[voiceSetting];

$("voiceSel").addEventListener("change", e => {
  voiceSetting = e.target.value;
  try { localStorage.setItem(VOICE_KEY, voiceSetting); } catch (err) {}
  dead.clear();
  $("voiceHint").textContent = HINTS[voiceSetting];
  setNote("");
});

$("testBtn").addEventListener("click", () => {
  const list = WORDS ? WORDS[level] : ["spelling"];
  speak(list[Math.floor(Math.random() * list.length)]);
});

function setNote(msg) {
  $("voiceNote").textContent = msg;
  $("testNote").textContent = msg;
}

/* ---------- Text to speech ---------- */
const audioCache = {};   // url -> Audio element (also used for preloading)
let player = null;
let speakToken = 0;

function pickVoice() {
  if (!hasTTS) return;
  const good = ["natural", "online", "premium", "enhanced", "google us", "samantha", "aria", "jenny", "ava"];
  const score = v => {
    const n = v.name.toLowerCase();
    return (good.some(g => n.includes(g)) ? 10 : 0) + (v.lang === "en-US" ? 2 : 0);
  };
  voice = speechSynthesis.getVoices()
    .filter(v => v.lang.startsWith("en"))
    .sort((a, b) => score(b) - score(a))[0] || null;
}
if (hasTTS) {
  pickVoice();
  speechSynthesis.addEventListener("voiceschanged", pickVoice);
}

// Which audio URLs to try, in order, for the chosen voice.
// The browser voice is always the last resort (handled in speak()).
function candidates(word) {
  const file = encodeURIComponent(word.toLowerCase());
  const all = {
    kokoro: { src: "kokoro", url: "audio/kokoro/" + file + ".wav" },
    piper:  { src: "piper",  url: "audio/piper/" + file + ".wav" },
    google: { src: "google", url: "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en-US&q=" + encodeURIComponent(word) }
  };
  if (voiceSetting === "browser") return [];
  if (voiceSetting === "auto") {
    return ["kokoro", "piper", "google"].filter(s => !dead.has(s)).map(s => all[s]);
  }
  return [all[voiceSetting]];
}

function getAudio(url) {
  if (!audioCache[url]) {
    const a = new Audio();
    a.preload = "auto";
    a.src = url;
    audioCache[url] = a;
  }
  return audioCache[url];
}

function stopAudio() {
  if (player) { player.pause(); player = null; }
  if (hasTTS) speechSynthesis.cancel();
  $("playRow").classList.remove("speaking");
}

function speakFallback(word, rate) {
  if (!hasTTS) return;
  const u = new SpeechSynthesisUtterance(word);
  u.lang = "en-US";
  u.rate = rate;
  if (voice) u.voice = voice;
  const row = $("playRow");
  u.onstart = () => row.classList.add("speaking");
  u.onend = u.onerror = () => row.classList.remove("speaking");
  speechSynthesis.speak(u);
}

function speak(word, rate = 0.85) {
  const token = ++speakToken;
  stopAudio();
  setNote("");
  const row = $("playRow");
  const list = candidates(word);

  function tryNext(i) {
    if (token !== speakToken) return;
    if (i >= list.length) {
      if (list.length) setNote("Selected voice unavailable, using browser voice.");
      speakFallback(word, rate);
      return;
    }

    const { src, url } = list[i];
    const a = getAudio(url);
    player = a;
    a.currentTime = 0;
    a.playbackRate = rate < 0.7 ? 0.7 : 1;

    let started = false;
    let timer = null;
    const fail = markDead => {
      if (token !== speakToken) return;
      clearTimeout(timer);
      a.onplaying = a.onended = a.onerror = null;
      a.pause();
      delete audioCache[url];
      if (markDead && voiceSetting === "auto") dead.add(src);
      tryNext(i + 1);
    };

    timer = setTimeout(() => { if (!started) fail(false); }, 3000);
    a.onplaying = () => { started = true; clearTimeout(timer); row.classList.add("speaking"); };
    a.onended = () => row.classList.remove("speaking");
    a.onerror = () => fail(true);
    a.play().catch(() => fail(false));
  }

  tryNext(0);
}

/* ---------- Random word picking ---------- */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function refill() {
  queue = shuffle(WORDS[level]);
  if (queue.length > 1 && queue[queue.length - 1] === current) queue.reverse(); // avoid immediate repeat
}

function nextWord() {
  if (queue.length === 0) refill();
  return queue.pop();
}

// Start loading the next word's audio while the player is still on this one
function preloadNext() {
  if (queue.length === 0) refill();
  const c = candidates(queue[queue.length - 1])[0];
  if (c) getAudio(c.url);
}

/* ---------- Game flow ---------- */
function newRound() {
  current = nextWord();
  locked = false;
  answer.value = "";
  answer.disabled = false;
  answer.className = "";
  feedback.textContent = "";
  feedback.className = "";
  answer.focus();
  speak(current);
  preloadNext();
}

function startGame() {
  if (!WORDS) return;
  score = 0; streak = 0;
  queue = [];
  current = "";
  $("score").textContent = 0;
  $("streak").textContent = 0;
  $("levelLabel").textContent = level[0].toUpperCase() + level.slice(1);
  menu.classList.add("hidden");
  game.classList.remove("hidden");
  newRound();
}

function check() {
  if (locked) return;
  const guess = answer.value.trim().toLowerCase();
  if (!guess) return;

  if (guess === current.toLowerCase()) {
    locked = true;
    score++; streak++;
    $("score").textContent = score;
    $("streak").textContent = streak;
    answer.className = "ok";
    answer.disabled = true;
    feedback.textContent = "Correct!";
    feedback.className = "ok";
    setTimeout(newRound, 900);
  } else {
    streak = 0;
    $("streak").textContent = 0;
    // restart the shake animation
    answer.className = "";
    void answer.offsetWidth;
    answer.className = "bad";
    feedback.textContent = "Not quite. Listen again and try once more.";
    feedback.className = "bad";
    answer.select();
  }
}

/* ---------- Events ---------- */
document.querySelectorAll(".level").forEach(btn => {
  btn.addEventListener("click", () => {
    level = btn.dataset.level;
    document.querySelectorAll(".level").forEach(b =>
      b.setAttribute("aria-pressed", b === btn ? "true" : "false"));
  });
});

$("startBtn").addEventListener("click", startGame);
$("playBtn").addEventListener("click", () => { speak(current); answer.focus(); });
$("slowBtn").addEventListener("click", () => { speak(current, 0.5); answer.focus(); });
$("checkBtn").addEventListener("click", check);
answer.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
answer.addEventListener("input", () => {
  if (!locked) { answer.className = ""; feedback.textContent = ""; }
});
$("menuBtn").addEventListener("click", () => {
  speakToken++;
  stopAudio();
  setNote("");
  game.classList.add("hidden");
  menu.classList.remove("hidden");
});
</script>
</body>
</html>
