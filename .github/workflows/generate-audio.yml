name: Generate audio

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "Voice engine"
        type: choice
        options:
          - kokoro
          - piper
          - edge
          - both
          - all
        default: kokoro

permissions:
  contents: write
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install espeak-ng
        run: sudo apt-get update && sudo apt-get install -y espeak-ng

      - name: Install Kokoro
        if: inputs.engine == 'kokoro' || inputs.engine == 'both' || inputs.engine == 'all'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install kokoro soundfile numpy

      - name: Install Piper
        if: inputs.engine == 'piper' || inputs.engine == 'both' || inputs.engine == 'all'
        run: |
          pip install piper-tts
          python -m piper.download_voices en_US-lessac-medium

      - name: Install Edge TTS
        if: inputs.engine == 'edge' || inputs.engine == 'all'
        run: pip install edge-tts

      - name: Generate audio
        run: python generate_audio.py --engine ${{ inputs.engine }} --piper-model en_US-lessac-medium

      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          git commit -m "Add generated audio" || echo "Nothing to commit"
          git push

      - name: Redeploy site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run static.yml
